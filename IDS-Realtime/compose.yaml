services:

  # ── Infrastructure ────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    hostname: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT_DOCKER://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT_DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: mongodb
    hostname: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # ── IDS Services ──────────────────────────────────────────────────
  spark:
    build: .
    container_name: spark
    network_mode: host          # needed so Spark can reach kafka/mongodb on localhost
    environment:
      KERAS_BACKEND: torch
      PYSPARK_PYTHON: python
    volumes:
      - ./models:/app/models
      - ./checkpoints:/app/checkpoints
    command: >
      spark-submit
      --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.2
      spark/spark_streaming_prediction.py
    depends_on:
      - kafka
      - mongodb
    restart: on-failure

  dashboard:
    build: .
    container_name: dashboard
    ports:
      - "8501:8501"
    command: streamlit run ui/dashboard.py --server.address 0.0.0.0 --server.port 8501
    depends_on:
      - mongodb
    restart: unless-stopped

  # ── Live Producer (optional — comment out to use CSV producer) ────
  producer-live:
    build: .
    container_name: producer-live
    network_mode: host          # needs host network to capture real packets
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      INTERFACE: wlo1           # change to your interface (eno2, eth0, etc.)
    command: >
      sh -c "python producer/kafka_producer_live.py --interface $$INTERFACE"
    depends_on:
      - kafka
    profiles:
      - live                    # only starts with: docker compose --profile live up

  # ── CSV Producer (default demo mode) ─────────────────────────────
  producer-csv:
    build: .
    container_name: producer-csv
    network_mode: host
    command: python producer/kafka_producer.py --limit 1000 --sleep 0.05
    depends_on:
      - kafka
    profiles:
      - demo                    # only starts with: docker compose --profile demo up

volumes:
  mongo_data:
